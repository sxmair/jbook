name: Auto book seat

on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"  # 19:30 UTC daily = 03:30 SGT next day (3.5h buffer before 07:00 SGT booking open)

jobs:
  book:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run booking
        env:
          SMARTEN_USER: ${{ secrets.SMARTEN_USER }}
          SMARTEN_PASS: ${{ secrets.SMARTEN_PASS }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD || '14' }}
          SEAT_NUMBER: ${{ vars.SEAT_NUMBER }}
          SEAT_FALLBACKS: ${{ vars.SEAT_FALLBACKS }}
          START_TIME_LABEL: ${{ vars.START_TIME_LABEL }}
          END_TIME_LABEL: ${{ vars.END_TIME_LABEL }}
          WAIT_BEFORE_BOOK: ${{ vars.WAIT_BEFORE_BOOK }}
          BOOK_AT_SGT: ${{ vars.BOOK_AT_SGT }}
        run: node scripts/book-seat.js
